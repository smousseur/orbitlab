# PHY-4 acceptance flight (spec docs/multi-corps/08-conception-L6.md §2, decision 5). When true, the
# application loads a translunar transfer at startup so the multi-arc trajectory can be looked at on
# screen. Off by the product's default; override on the command line with
#   -Dmission.lunarDemo=true
# It is a property and not a menu entry deliberately: MIS-4 is what will give a lunar mission its
# real door (a wizard profile), and a demonstration entry shipped in the menu would have to be
# removed then.
mission.lunarDemo=false