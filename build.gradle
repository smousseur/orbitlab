plugins {
    id 'java'
    id 'com.gradleup.shadow' version '8.3.6'
    id 'com.diffplug.spotless' version '8.10.0'
    id 'pmd'
    id 'jacoco'
}

group = 'com.smousseur'
version = (findProperty('appVersion') ?: '1.1.1')
ext.jmonkeyengineVersion = '3.9.0-beta1'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.orekit:orekit:13.1.1'
    implementation 'org.jmonkeyengine:jme3-core:' + jmonkeyengineVersion
    implementation 'org.jmonkeyengine:jme3-desktop:' + jmonkeyengineVersion
    implementation 'org.jmonkeyengine:jme3-effects:' + jmonkeyengineVersion
    implementation 'org.jmonkeyengine:jme3-jogg:' + jmonkeyengineVersion
    runtimeOnly 'org.jmonkeyengine:jme3-plugins:' + jmonkeyengineVersion
    runtimeOnly 'org.jmonkeyengine:jme3-lwjgl3:' + jmonkeyengineVersion

    implementation 'com.simsilica:lemur:1.16.0'
    implementation 'com.simsilica:lemur-proto:1.13.0'

    implementation 'org.codehaus.groovy:groovy-all:2.4.12'

    implementation 'io.projectreactor:reactor-core:3.7.8'

    implementation 'com.google.guava:guava:33.4.8-jre'

    implementation 'org.apache.logging.log4j:log4j-core:2.24.3'
    implementation 'org.apache.logging.log4j:log4j-api:2.24.3'

    implementation 'com.github.luben:zstd-jni:1.5.6-6'

    implementation 'tools.jackson.core:jackson-databind:3.2.1'

    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

jacoco {
    toolVersion = '0.8.14'
}

test {
    useJUnitPlatform()
    jvmArgs '-XX:MaxDirectMemorySize=2g'
    systemProperty 'orbitlab.slowTests', System.getProperty('orbitlab.slowTests', 'false')
    systemProperty 'orbitlab.probe', System.getProperty('orbitlab.probe', 'false')
    finalizedBy jacocoTestReport
}

jacocoTestReport {
    dependsOn test

    reports {
        html.required = true
        xml.required = true
        csv.required = false
    }
}

tasks.register('meshProbe', JavaExec) {
    group = 'orbitlab'
    description = 'Reports the frame each planetary mesh carries and whether it conforms to the export convention'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.smousseur.orbitlab.tools.meshprobe.MeshProbeMain'
}

javadoc {
    options {
        encoding = 'UTF-8'
        charSet = 'UTF-8'
        author = true
        version = true
        links 'https://docs.oracle.com/en/java/javase/17/docs/api/'
        addStringOption('Xdoclint:none', '-quiet')
    }
    failOnError = false
}

spotless {
    java {
        googleJavaFormat()
        removeUnusedImports()
        formatAnnotations()
    }
}

pmd {
    toolVersion = '7.16.0'
    consoleOutput = true
    ignoreFailures = false

    ruleSetFiles = files("$rootDir/config/pmd/ruleset.xml")
    ruleSets = []
}

shadowJar {
    archiveFileName = 'orbitlab.jar'
    mergeServiceFiles()          // Orekit / Jackson / log4j use META-INF/services
    manifest {
        attributes(
                'Main-Class': 'com.smousseur.orbitlab.OrbitLabApplication',
                'Implementation-Version': project.version,
                'Multi-Release': 'true'   // log4j-api is multi-release
        )
    }
    exclude 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA'
    exclude 'module-info.class', '**/module-info.class'
}